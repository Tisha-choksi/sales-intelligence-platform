[project]
name = "sales-intelligence-backend"
version = "0.1.0"
description = "AI Sales Intelligence + Outreach Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Redis
    "redis>=5.0.0",
    "hiredis>=2.3.0",

    # Task queue
    "celery[rabbitmq]>=5.4.0",
    "kombu>=5.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # HTTP client
    "httpx>=0.27.0",

    # AI
    "anthropic>=0.34.0",

    # Email
    "sendgrid>=6.11.0",

    # CSV processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Email verification
    "dnspython>=2.6.0",

    # Storage
    "boto3>=1.35.0",

    # Stripe
    "stripe>=10.0.0",

    # Monitoring
    "sentry-sdk[fastapi]>=2.13.0",

    # Utilities
    "python-slugify>=8.0.0",
    "email-validator>=2.2.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

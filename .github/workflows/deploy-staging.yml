name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build & push backend image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sip-backend:staging backend/
          docker push ${{ secrets.DOCKER_USERNAME }}/sip-backend:staging

      - name: Deploy to staging server
        # Replace with your actual deploy step (SSH, K8s, Render, Railway, etc.)
        run: echo "Deploy to staging — configure your target here"

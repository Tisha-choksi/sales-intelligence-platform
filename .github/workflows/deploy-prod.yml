name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4

      - name: Build & push backend image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sip-backend:${{ github.sha }} backend/
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sip-backend:latest backend/
          docker push ${{ secrets.DOCKER_USERNAME }}/sip-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sip-backend:latest

      - name: Rolling deploy
        run: echo "Rolling K8s deploy — configure kubectl here"
